# Render Blueprint for the LMS backend on free tiers: Django API + WebSockets (Daphne) on a
# free web service, Postgres on Neon (free), uploads in Cloudflare R2 (free). One instance, so
# chat uses the in-memory channel layer and needs no Redis. The LMS frontend and the website
# are on Vercel. Apply from the Render dashboard: New > Blueprint > this repo. See DEPLOYMENT.md.
#
# Free web services sleep after 15 minutes without traffic; the next request wakes them in
# about a minute. To grow: switch `plan`, add Render Postgres/Key Value, set REDIS_URL.

services:
  - type: web
    name: inspired-minds-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /healthz/
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Render's proxy is the one hop in front of Django (rate limits read the client IP).
      - key: NUM_PROXIES
        value: "1"
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.eu-central-1.aws.neon.tech/inspired_minds?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Cloudflare R2 bucket for uploads (resources and avatars).
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Set once the Vercel URLs are known.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
