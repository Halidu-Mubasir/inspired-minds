# Render Blueprint for the LMS backend: Django API + WebSockets (Daphne), Postgres, Key Value
# (Redis) for chat and rate limits, and a disk for uploads. The LMS frontend and the website
# are deployed on Vercel. Apply from the Render dashboard: New > Blueprint > this repo.
# All resources share one region so they talk over Render's private network.

services:
  - type: web
    name: inspired-minds-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: frankfurt
    # Disks need a paid instance; a disk also pins the service to one instance.
    plan: 0.5c-512mb
    healthCheckPath: /healthz/
    autoDeployTrigger: commit
    disk:
      name: uploads
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_POSTGRES
        value: "True"
      - key: DB_HOST
        fromDatabase: { name: inspired-minds-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: inspired-minds-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: inspired-minds-db, property: database }
      - key: DB_USER
        fromDatabase: { name: inspired-minds-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: inspired-minds-db, property: password }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: inspired-minds-redis, property: connectionString }
      - key: USE_REDIS_CACHE
        value: "True"
      # Render's proxy is the one hop in front of Django (rate limits read the client IP).
      - key: NUM_PROXIES
        value: "1"
      - key: MEDIA_ROOT
        value: /app/data/media
      - key: PRIVATE_MEDIA_ROOT
        value: /app/data/private_media
      - key: SERVE_MEDIA
        value: "True"
      # Set these in the dashboard once the Vercel URLs are known (see DEPLOYMENT.md).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: keyvalue
    name: inspired-minds-redis
    region: frankfurt
    plan: free
    # Channels' message queues must not be evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only

databases:
  - name: inspired-minds-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: inspired_minds
    user: inspired_minds
    ipAllowList: [] # private network only
