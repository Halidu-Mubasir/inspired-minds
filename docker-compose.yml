# Full stack on one machine: `cp .env.example .env`, set SECRET_KEY, then `docker compose up --build`.
#   LMS:      http://localhost:3000
#   Website:  http://localhost:3001
#   API:      http://localhost:8000 (admin at /admin/)
# Production settings (DEBUG off) over plain HTTP on localhost. For a real deployment, put a
# TLS-terminating proxy in front and remove the SECURE_SSL_REDIRECT / *_COOKIE_SECURE overrides.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inspired_minds
      POSTGRES_USER: inspired_minds
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inspired_minds}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspired_minds -d inspired_minds"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      USE_POSTGRES: "True"
      DB_NAME: inspired_minds
      DB_USER: inspired_minds
      DB_PASSWORD: ${DB_PASSWORD:-inspired_minds}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_CACHE: "True"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Inspired Minds <no-reply@localhost>}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Plain HTTP on localhost only — see the note at the top.
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
    volumes:
      - media:/app/media
      - private-media:/app/private_media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    depends_on:
      - backend
    ports:
      - "3000:3000"

  website:
    build:
      context: ./website
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3001:3000"

volumes:
  postgres-data:
  media:
  private-media:
